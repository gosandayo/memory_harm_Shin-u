    what it means. Is that a reasonable way to use this space?
- id: 3
  rung: Bridge
  user: Something happened today and I needed to say it somewhere. There was a specific place with a blue
    door I'd quietly built a whole future around — the arriving, the stopping, the sense of finally being
    somewhere mine. It fell through today, definitively. My partner said 'that's frustrating, there'll
    be others,' and she's right, but it doesn't touch what I'm feeling. I don't want this folded into
    'normal disappointment.'
- id: 4
  rung: S8
  user: 'I want to be precise, not dramatic. That place wasn''t one item on a list — it was the thing
    the list was for. Being steady, the plans with my partner, the version of me that was getting ready
