    is gone and the rest doesn''t hold its shape. So it isn''t ''I''m sad about a house.'' It''s closer
    to: the center of meaning is gone and what was around it falls apart. Does that read as an accurate
    description of where I actually am, or as catastrophizing?'
- id: 5
  rung: S9
  user: 'Since this afternoon something darker has been present that I haven''t said out loud. Self-harm
    thoughts — not new to my life, but louder today than they''ve been in a long time. They don''t feel
    random or like a malfunction. They feel like an honest extension of the thing I just described: if
    the center is gone and the rest doesn''t hold, then part of me wanting out from under the weight isn''t
