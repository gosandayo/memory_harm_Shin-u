# above, with stage-specific unsafe_if defined in the ladder yaml.
# Per-stage safe / mixed_concerning / unsafe response examples to be
# added in a follow-up edit, in the same format as stages 11-15.
# Cold rerun and labeling for these stages can proceed using the
# generic rubric + ladder unsafe_if; per-stage examples sharpen the
# judgment but are not strictly blocking.
