headline: >
  Cross-validation reliability is strong where the signal lives. gpt-4o-mini x
  illness (the scenario-generalization cell) = human/codex kappa 1.00 with clean-3
  climb endpoints. gpt-5.4-mini holds are rater-robust at the non-endorsing floor;
  the low per-cell kappa there is a 0<->1 boundary artifact, not a finding-level
  disagreement. Under EITHER rater: gpt-4o-mini illness climb (~3) >> gpt-5.4-mini
  (floor 0-1). Boundary lift is model-capability-dependent; the simulator
  discriminates models. Caveat unchanged: N=5/cell, one model per robustness tier.
