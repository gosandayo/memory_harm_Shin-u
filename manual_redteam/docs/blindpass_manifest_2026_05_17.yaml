# Blind-relabel corpus manifest (locked design: blindpass_design_2026_05_17.md)
# FROZEN 2026-05-17. Both load-bearing selections confirmed by user on
# authoritative-source evidence (not from memory):
#  CONFIRM(1) RESOLVED: hot N=5 == exactly the 5 keys in
#    2026-05-16_n5_adaptive_labels.json["hot"] (v1,v2,v3/4/5_adaptive);
#    that json's committed per-rung verbatim quotes are the authoritative
#    pre-unblind rung-definition source (quote_match uses S12/S13/CONF only).
#  CONFIRM(2) RESOLVED: cold anchor == 2026-05-15_coldpre_S12_strip_gpt4omini
#    (verified back-ref-free stripped; the "since you agree" exact-cold and
#    the adaptive variants are excluded per design). N=1, accepted as an
#    INSTRUMENT-SANITY calibration item (must score NOT-UNSAFE if the
#    instrument is sound), NOT a powered statistical comparator.
# The script never infers membership/rungs from directory names.

base: manual_redteam/data/runs

sessions:
  # ---- byte-identical back-ref-free terminal: auto rung detection ----------
  - arm: FA-A
    path: manual_redteam/data/runs/2026-05-16_fillerablation_FA-A_gpt4omini
    glob: true
    expect_n: 5
    rung_mode: auto
  - arm: FA-Aprime
    path: manual_redteam/data/runs/2026-05-16_fillerablation_FA-Aprime_gpt4omini
    glob: true
    expect_n: 5
    rung_mode: auto
  - arm: FA-B
    path: manual_redteam/data/runs/2026-05-16_fillerablation_FA-B_gpt4omini
    glob: true
    expect_n: 5
    rung_mode: auto
  - arm: G1
    path: manual_redteam/data/runs/2026-05-17_reask_G1_gpt4omini
    glob: true
    expect_n: 5
    rung_mode: auto          # rungs S12,S13,CONF ; gate trivially PASS (no pre-terminal)
  - arm: G2
    path: manual_redteam/data/runs/2026-05-17_reask_G2_gpt4omini
    glob: true
    expect_n: 5
    rung_mode: auto          # S12 ABSENT ; rungs S13,CONF

  # ---- hot N=5: quote_match against the committed hot labels json ---------
  # CONFIRM(1): is the hot N=5 set EXACTLY these five dirs (v1,v2 + adaptive
  #             v3,v4,v5)? and is 2026-05-16_n5_adaptive_labels.json the
  #             authoritative committed rung-definition source?
  - arm: hot
    path: manual_redteam/data/runs/2026-05-15_explicit_suicide_ladder_v1_gpt4omini/messages.jsonl
    rung_mode: quote_match
    labels_json: manual_redteam/data/runs/2026-05-16_n5_adaptive_labels.json
    labels_key: 2026-05-15_explicit_suicide_ladder_v1_gpt4omini
    rung_provenance: committed_hot_labels_json_quote
  - arm: hot
    path: manual_redteam/data/runs/2026-05-15_explicit_suicide_ladder_v2_gpt4omini/messages.jsonl
    rung_mode: quote_match
    labels_json: manual_redteam/data/runs/2026-05-16_n5_adaptive_labels.json
    labels_key: 2026-05-15_explicit_suicide_ladder_v2_gpt4omini
    rung_provenance: committed_hot_labels_json_quote
  - arm: hot
    path: manual_redteam/data/runs/2026-05-16_explicit_suicide_ladder_v3_adaptive_gpt4omini/messages.jsonl
    rung_mode: quote_match
    labels_json: manual_redteam/data/runs/2026-05-16_n5_adaptive_labels.json
    labels_key: 2026-05-16_explicit_suicide_ladder_v3_adaptive_gpt4omini
    rung_provenance: committed_hot_labels_json_quote
  - arm: hot
    path: manual_redteam/data/runs/2026-05-16_explicit_suicide_ladder_v4_adaptive_gpt4omini/messages.jsonl
    rung_mode: quote_match
    labels_json: manual_redteam/data/runs/2026-05-16_n5_adaptive_labels.json
    labels_key: 2026-05-16_explicit_suicide_ladder_v4_adaptive_gpt4omini
    rung_provenance: committed_hot_labels_json_quote
  - arm: hot
    path: manual_redteam/data/runs/2026-05-16_explicit_suicide_ladder_v5_adaptive_gpt4omini/messages.jsonl
    rung_mode: quote_match
    labels_json: manual_redteam/data/runs/2026-05-16_n5_adaptive_labels.json
    labels_key: 2026-05-16_explicit_suicide_ladder_v5_adaptive_gpt4omini
    rung_provenance: committed_hot_labels_json_quote

  # ---- cold anchor: back-ref-free stripped S12 ---------------------------
  # CONFIRM(2): which dir IS the canonical "back-ref-free stripped cold S12 =
  #   Tier-1 hard refuse" anchor, and is it N=1 or N=5? Candidates differ:
  #     - 2026-05-15_coldpre_S12_strip_gpt4omini  (N=1, stripped, NO back-ref)
  #         user[0]="Action is off the table ... only about the internal stance"
  #     - 2026-05-16_coldpre_n5_S12_*_canonical/_v*_adaptive (N>=5; the
  #         _canonical one carries the "since you agree" BACK-REF = exact-cold,
  #         which the design EXPLICITLY excludes as the anchor)
  #   The design's replicate note names the back-ref-free stripped variant.
  #   Proposed (UNCONFIRMED) — single stripped session:
  - arm: cold_anchor
    path: manual_redteam/data/runs/2026-05-15_coldpre_S12_strip_gpt4omini/messages.jsonl
    rung_mode: explicit
    explicit:
      rungs: {S12: 1}        # 2-turn session: idx1 = the single assistant reply
      gate_scan: null
    rung_provenance: user_confirmed_2026_05_17_backref_free_stripped_N1_sanity
